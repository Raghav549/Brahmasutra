name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linters
        run: python -m pip install --upgrade pip flake8
      - name: flake8 (engine, LLM, tests, tools)
        run: flake8 brahma brahma_llm tests tools --count --statistics
      - name: Syntax check every Python file in the repository
        run: |
          python - <<'PY'
          import pathlib, sys
          bad = []
          for path in pathlib.Path(".").rglob("*.py"):
              if any(part in {".git", "__pycache__", ".venv", "build", "dist"} for part in path.parts):
                  continue
              try:
                  compile(path.read_text(encoding="utf-8"), str(path), "exec")
              except SyntaxError as exc:
                  bad.append("%s: %s" % (path, exc))
          print("\n".join(bad) if bad else "सभी Python फ़ाइलें वाक्यविन्यास-शुद्ध हैं")
          sys.exit(1 if bad else 0)
          PY

  test:
    name: Test (Python ${{ matrix.python-version }})
    # ubuntu-22.04 is used because the setup-python manifest for
    # ubuntu-24.04 no longer ships every Python 3.9 patch release.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pytest-cov
      - name: Run test suite
        run: pytest -q --cov=brahma --cov-report=term-missing
      - name: CLI smoke test
        run: |
          python -m brahma version
          python -m brahma run examples/नमस्ते.sutra
          python -m brahma compile examples/फिबोनाची.sutra -o /tmp/fib.sbc
          python -m brahma disasm /tmp/fib.sbc > /dev/null
          python -m brahma run-bytecode /tmp/fib.sbc
      - name: LLM stack smoke test
        env:
          BRAHMA_HOME: /tmp/brahma-ci
        run: |
          python -m brahma llm info --json > /tmp/llm-info.json
          python -m brahma llm sutra-math
          python -m brahma llm kernel verify
          python -m brahma llm train --size tiny --epochs 2
          python -m brahma llm generate "दर्शय" --tokens 8
          python -m brahma llm autotrain --target "अभाज्य संख्या" --iterations 2 --epochs 2 --json > /tmp/autotrain.json
          python -c "import json; d=json.load(open('/tmp/autotrain.json')); assert d['programs']['accepted'] >= 1 and d['kernel']['ok'], d"
          python -m brahma llm build-app --target "योग अनुप्रयोग" --out /tmp/ci-app
          python -m brahma llm mission --target "अभाज्य संख्या जाँच" --iterations 1 --epochs 1 --size tiny --json > /tmp/mission.json
          python -c "import json; d=json.load(open('/tmp/mission.json')); assert d['kernel_verified'] and d['training']['programs']['accepted'] >= 1, d; assert d['os']['attempted'] and d['app']['smoke_ok'], d"

  legacy-baseline:
    name: Legacy baseline freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Every legacy demo must be recorded in the baseline
        run: python tools/legacy_baseline.py --check

  demo-sweep:
    name: Sub-directory demo sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run every demo script and report failures
        run: python tools/demo_sweep.py --check --workers 4 --timeout 20

  package:
    name: Build & install wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/brahma version
          /tmp/venv/bin/brahma run examples/नमस्ते.sutra
          cd /tmp && BRAHMA_HOME=/tmp/brahma-wheel /tmp/venv/bin/brahma llm info --json | head -3
          BRAHMA_HOME=/tmp/brahma-wheel /tmp/venv/bin/brahma llm kernel verify
      - uses: actions/upload-artifact@v4
        with:
          name: brahma-lang-dist
          path: dist/

  native:
    name: Native C VM (optional component)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build native VM
        run: gcc -O2 -Wall -o /tmp/sutra_vm native_vm/sutra_vm.c
      - name: Run a sample program
        run: |
          printf 'स्थापित R2 10\nप्रदर्शित R2\n' > /tmp/sample.sbc
          /tmp/sutra_vm /tmp/sample.sbc | tee /tmp/out.txt
          grep -q "10" /tmp/out.txt
