
<html>

<body style="background:black;color:lime;text-align:center">

<h1>chat_app</h1>

<input id="u" placeholder="username"><br><br>
<input id="p" placeholder="password" type="password"><br><br>

<button onclick="register()">REGISTER</button>
<button onclick="login()">LOGIN</button>
<button onclick="dashboard()">DASHBOARD</button>

<h3 id="result"></h3>

<script>

token=""

function register()
{
fetch("http://127.0.0.1:9000/register",
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username:u.value,
password:p.value
})
})
.then(r=>r.json())
.then(d=>result.innerText=JSON.stringify(d))
}

function login()
{
fetch("http://127.0.0.1:9000/login",
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username:u.value,
password:p.value
})
})
.then(r=>r.json())
.then(d=>
{
token=d.token
result.innerText=JSON.stringify(d)
})
}

function dashboard()
{
fetch("http://127.0.0.1:9000/dashboard",
{
headers:{token:token}
})
.then(r=>r.json())
.then(d=>result.innerText=JSON.stringify(d))
}

</script>

</body>

</html>
