
<!DOCTYPE html>
<html>
<head>
<title>ai_assistant__with_login_and_dashboard</title>
<style>

body {
font-family: Arial;
background: #0f172a;
color: white;
text-align: center;
margin-top: 100px;
}

button {
padding: 15px;
font-size: 18px;
background: #2563eb;
color: white;
border: none;
border-radius: 10px;
cursor: pointer;
}

</style>
</head>

<body>

<h1>Brahma Generated App</h1>

<p>ai_assistant__with_login_and_dashboard ready</p>

<button onclick="callBackend()">Test Backend</button>

<p id="output"></p>

<script>

function callBackend() {

fetch("http://127.0.0.1:5000/")
.then(r=>r.json())
.then(d=>{
document.getElementById("output").innerText =
JSON.stringify(d)
})
.catch(e=>{
document.getElementById("output").innerText =
"Backend error"
})

}

</script>

</body>
</html>
